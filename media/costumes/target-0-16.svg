<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  
  <rect width="40" height="40" fill="#585858"></rect>
  
  
  <g>
    
    <polygon points="20,4 36,20 20,36 4,20" fill="#6A6A6A" stroke="#3A3A3A" stroke-width="0.8"></polygon>
    
    <polygon points="20,6 34,20 20,34 6,20" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"></polygon>
    
    <polygon points="20,20 34,20 20,34 6,20" fill="#000000" opacity="0.15"></polygon>

    
    <g fill="#6A6A6A" stroke="#3A3A3A" stroke-width="0.8">
      <polygon points="0,-16 16,0 0,16 -16,0"></polygon>
      <polygon points="40,-16 56,0 40,16 24,0"></polygon>
      <polygon points="0,24 16,40 0,56 -16,40"></polygon>
      <polygon points="40,24 56,40 40,56 24,40"></polygon>
    </g>
    
    <g fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3">
      <polygon points="0,-14 14,0 0,14 -14,0"></polygon>
      <polygon points="40,-14 54,0 40,14 26,0"></polygon>
      <polygon points="0,26 14,40 0,54 -14,40"></polygon>
      <polygon points="40,26 54,40 40,54 26,40"></polygon>
    </g>
  </g>

  
  <rect width="40" height="40" fill="none" opacity="0.12"></rect>
  <defs>
    <pattern id="noise" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"></rect>
      <circle cx="1" cy="1" r="0.5" fill="#FFFFFF"></circle>
      <circle cx="3" cy="3" r="0.3" fill="#000000"></circle>
    </pattern>
  </defs>
</svg>